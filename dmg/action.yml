name: 'Apple release · notarized DMG'
description: 'Developer ID sign → DMG → notarize → staple, producing a directly distributable .dmg (the direct-download channel used by Homebrew / GitHub Releases).'

# This is a different deliverable from the App Store one, hence a separate action: a repo
# that only ships to the App Store (browser extensions, etc.) should not be dragged into
# the DMG and notarization dependencies.
#
# All the logic lives in scripts/dmg.sh, which also runs locally (pass these inputs as
# environment variables).

inputs:
  certificate-base64:
    description: 'base64 of the bundle .p12 (must contain a Developer ID Application identity)'
    required: true
  certificate-password:
    description: 'export password of the .p12'
    required: true
  api-key:
    description: 'App Store Connect API key (base64 of the .p8 contents), used for notarization'
    required: true
  api-key-id:
    description: 'App Store Connect API key id'
    required: true
  api-issuer:
    description: 'App Store Connect API issuer id'
    required: true
  project:
    description: 'path to the .xcodeproj'
    required: true
  scheme:
    description: 'scheme name'
    required: true
  version:
    description: 'MARKETING_VERSION'
    required: true
  build-number:
    description: 'CFBundleVersion; when empty it is derived from version as x*10000 + y*100 + z'
    required: false
    default: ''
  signing-identity:
    description: 'full name of the signing identity; when empty the first Developer ID Application in the keychain is used'
    required: false
    default: ''
  volume-name:
    description: 'DMG volume name; when empty the .app name is used'
    required: false
    default: ''
  dmg-name:
    description: 'output file name; when empty it is <App>-macos.dmg'
    required: false
    default: ''
  working-directory:
    description: 'directory the project lives in, for monorepos'
    required: false
    default: '.'

outputs:
  dmg-path:
    description: 'absolute path of the notarized and stapled .dmg'
    value: ${{ steps.dmg.outputs.dmg-path }}

runs:
  using: 'composite'
  steps:
    - name: archive → dmg → notarize → staple
      id: dmg
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PROJECT: ${{ inputs.project }}
        SCHEME: ${{ inputs.scheme }}
        VERSION: ${{ inputs.version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        SIGNING_IDENTITY: ${{ inputs.signing-identity }}
        VOLUME_NAME: ${{ inputs.volume-name }}
        DMG_NAME: ${{ inputs.dmg-name }}
        APPLE_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        APPLE_API_KEY: ${{ inputs.api-key }}
        APPLE_API_KEY_ID: ${{ inputs.api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.api-issuer }}
      run: ${{ github.action_path }}/../scripts/dmg.sh
