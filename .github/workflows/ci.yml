name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # These scripts are mostly run by the release pipeline on macOS runners (tens of minutes per
      # run, and it burns quota), so at least get the syntax checked here.
      - name: bash -n
        run: |
          for f in scripts/*.sh; do
            echo "── $f"
            bash -n "$f"
          done
      # shellcheck catches what `bash -n` cannot see (unquoted expansions, `==` misuse, a missing
      # `local`, ...), and these scripts only really run when a release happens.
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh
