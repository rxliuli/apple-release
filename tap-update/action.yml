name: 'Apple release · Homebrew cask'
description: "Bump a Homebrew tap cask's version and sha256 to a just-released artifact."

# Unrelated to Apple, hence its own action: repos that publish to brew call it, repos that
# do not can ignore it. (The action-homebrew-bump-cask on the marketplace is 9 stars and
# unmaintained since 2021, and the official Homebrew/actions only serve official repos, so
# there is nothing off-the-shelf for third-party taps.)

inputs:
  cask:
    description: 'cask name (matches Casks/<name>.rb in the tap)'
    required: true
  version:
    description: 'new version number'
    required: true
  artifact:
    description: 'the file being released (the .dmg the cask url points at), used to compute sha256'
    required: true
  token:
    description: 'GitHub token with push access to the tap repo'
    required: true
  tap:
    description: 'tap repo (owner/repo)'
    required: false
    default: 'rxliuli/homebrew-tap'
  cask-path:
    description: "relative path of the cask file inside the tap; when empty it is Casks/<cask>.rb"
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Bump cask version + sha256
      shell: bash
      env:
        TAP: ${{ inputs.tap }}
        CASK: ${{ inputs.cask }}
        VERSION: ${{ inputs.version }}
        ARTIFACT: ${{ inputs.artifact }}
        TOKEN: ${{ inputs.token }}
        CASK_PATH: ${{ inputs.cask-path }}
      run: ${{ github.action_path }}/../scripts/tap-update.sh
