name: 'Apple release · App Store Connect'
description: 'Archive → export → validate → (optionally) upload a macOS/iOS app to App Store Connect. Does not submit for review.'

# All the logic lives in scripts/asc.sh: it runs both in CI and locally (locally you
# just pass these inputs as environment variables), so there is no pipeline you can
# only debug by pushing. This action is a pass-through.
#
# Shipping to the App Store and shipping a DMG are two different deliverables, so they
# get one action each - do not merge them "for consistency": a repo that only ships to
# the App Store (browser extensions, etc.) should not be dragged into the DMG and
# notarization dependencies.

inputs:
  certificate-base64:
    description: 'base64 of the bundle .p12 (development/distribution/installer/Developer ID can all live in one file, shared across repos)'
    required: true
  certificate-password:
    description: 'export password of the .p12'
    required: true
  api-key:
    description: 'App Store Connect API key (base64 of the .p8 contents)'
    required: true
  api-key-id:
    description: 'App Store Connect API key id'
    required: true
  api-issuer:
    description: 'App Store Connect API issuer id'
    required: true
  project:
    description: 'path to the .xcodeproj'
    required: true
  scheme:
    description: 'scheme name'
    required: true
  platform:
    description: 'macos or ios'
    required: true
  version:
    description: 'MARKETING_VERSION'
    required: true
  build-number:
    description: 'CFBundleVersion; when empty it is derived from version as x*10000 + y*100 + z'
    required: false
    default: ''
  team-id:
    description: 'Apple Developer Team ID'
    required: true
  release:
    description: "'true' actually uploads; anything else rehearses up to passing Apple's validation only"
    required: false
    default: 'false'
  working-directory:
    description: 'directory the project lives in, for monorepos'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: xcodebuild archive → export → validate → upload
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PROJECT: ${{ inputs.project }}
        SCHEME: ${{ inputs.scheme }}
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        TEAM_ID: ${{ inputs.team-id }}
        RELEASE: ${{ inputs.release }}
        APPLE_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        APPLE_API_KEY: ${{ inputs.api-key }}
        APPLE_API_KEY_ID: ${{ inputs.api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.api-issuer }}
      run: ${{ github.action_path }}/../scripts/asc.sh
